name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Every action is pinned to an EXACT release, never a floating `@v4` major.
    # Two reasons, and the first is not optional:
    #
    #   1. Not every publisher HAS floating majors. astral-sh stopped moving
    #      them after v7, so `astral-sh/setup-uv@v9` resolved to nothing and
    #      failed the job before a single step ran — four deploys in a row, with
    #      no gate ever executing. A pin cannot fail that way.
    #   2. The repo already refuses to install an npm package less than 7 days
    #      old (`minimumReleaseAge` = 10080 min). A floating major is the same
    #      unreviewed-upgrade risk with none of that soak time — `@v6` would
    #      pull a release published four days ago.
    #
    # The cost is that bumps are manual: check the release date, take the newest
    # that is at least a week old, run the gates locally, then commit.
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # v5 began auto-caching whenever package.json has `packageManager`, then
      # v6 narrowed that to npm only — so with pnpm nothing is cached here and
      # this step does not need to run after the pnpm setup below.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'

      # No `version` input on purpose: the action reads `packageManager` from
      # package.json, which is the single place the pnpm version is declared.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      # The Python side of the repo (build-tools/tts). uv reads the interpreter
      # version from build-tools/tts/.python-version and provisions it itself,
      # so there is no setup-python step and no second place to bump it.
      # shellcheck needs nothing: it is preinstalled on the ubuntu runners.
      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python Dependencies
        run: uv sync --directory build-tools/tts --frozen

      # Every gate below is the SAME script the pre-commit hook runs through
      # lint-staged, just over the whole tree instead of the staged files. The
      # hook is the fast feedback loop; this is the one that actually decides.
      # Deliberately ordered cheapest-first so an obvious failure reports early.
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Lint shell
        run: pnpm run lint:sh

      - name: Lint Python
        run: pnpm run lint:py

      - name: Format check Python
        run: pnpm run format:py:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Python tests
        run: uv run --directory build-tools/tts pytest -q

      - name: Build
        run: pnpm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          folder: dist
          branch: gh-pages
