name: Deploy to GitHub Pages

# A pull request runs every gate below but stops short of publishing (see the
# `if` on the Deploy step). This exists so Dependabot's daily PRs are actually
# tested: auto-merge is only worth having if something ran the suite first, and
# a push-only trigger would have merged unverified bumps straight to main.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Every action is pinned to an EXACT release, never a floating `@v4` major.
    # Two reasons, and the first is not optional:
    #
    #   1. Not every publisher HAS floating majors. astral-sh stopped moving
    #      them after v7, so `astral-sh/setup-uv@v9` resolved to nothing and
    #      failed the job before a single step ran — four deploys in a row, with
    #      no gate ever executing. A pin cannot fail that way.
    #   2. The repo already refuses to install an npm package less than 7 days
    #      old (`minimumReleaseAge` = 10080 min). A floating major is the same
    #      unreviewed-upgrade risk with none of that soak time — `@v6` would
    #      pull a release published four days ago.
    #
    # The cost is that bumps are manual: check the release date, take the newest
    # that is at least a week old, run the gates locally, then commit.
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # v5 began auto-caching whenever package.json has `packageManager`, then
      # v6 narrowed that to npm only — so with pnpm nothing is cached here and
      # this step does not need to run after the pnpm setup below.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'

      # pnpm/setup, NOT the older pnpm/action-setup, whose README now points
      # here. v2 downloads pnpm's self-contained release binary and checks it
      # against GitHub's published SHA-256, instead of installing `@pnpm/exe`
      # through npm — the path that shipped a placeholder binary for pnpm
      # 11.13.0 and failed later with a bare `This: not found`.
      #
      # The one action here younger than the 7-day soak rule (released
      # 2026-08-04). Taken deliberately: v1 is the npm-install architecture v2
      # exists to replace, so waiting would have meant migrating twice.
      #
      # No `version` input on purpose: the action reads `packageManager` from
      # package.json, which is the single place the pnpm version is declared.
      # It requires pnpm >= 11; this repo is on 11.18.0. No `runtime` input
      # either — that would make package.json a second source of the Node
      # version, and `.nvmrc` above is meant to be the only one.
      #
      # `install: false` is NOT redundant with the explicit install step below,
      # it is what makes that step mean anything. This input defaults to true,
      # and the install it runs has no `--frozen-lockfile`: handed a package.json
      # that disagrees with pnpm-lock.yaml it reconciles the lockfile on disk and
      # carries on, after which `--frozen-lockfile` compares against the repaired
      # file and passes. The gate would still be there, just unable to fail.
      - name: Setup pnpm
        uses: pnpm/setup@v2.0.2
        with:
          install: false

      # The Python side of the repo (build-tools/tts). uv reads the interpreter
      # version from build-tools/tts/.python-version and provisions it itself,
      # so there is no setup-python step and no second place to bump it.
      # shellcheck needs nothing: it is preinstalled on the ubuntu runners.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      # `--frozen-lockfile` below is deliberately never used for resolution — it
      # only compares the lockfile against package.json and installs exactly
      # what is pinned, so it never runs the `minimumReleaseAge` supply-chain
      # check. That check only fires during real resolution, which is why
      # unbash@4.0.10 (build 957f431) rode in on an unrelated Dependabot bump,
      # passed CI, and auto-merged: Dependabot's own `cooldown` in
      # dependabot.yml only vets the packages it directly proposes, not
      # transitive versions that shift as a side effect of regenerating the
      # lockfile. This step is the actual gate for that: `--lockfile-only`
      # does full resolution (so it hits the policy check) without downloading
      # packages or touching node_modules, and the diff after it catches the
      # same drift `--frozen-lockfile` would — just before merge instead of on
      # some contributor's machine days later.
      - name: Verify lockfile policy
        run: |
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python Dependencies
        run: uv sync --directory build-tools/tts --frozen

      # Every gate below is the SAME script the pre-commit hook runs through
      # lint-staged, just over the whole tree instead of the staged files. The
      # hook is the fast feedback loop; this is the one that actually decides.
      # Deliberately ordered cheapest-first so an obvious failure reports early.
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint:css

      - name: Lint shell
        run: pnpm run lint:sh

      - name: Lint Python
        run: pnpm run lint:py

      - name: Format check Python
        run: pnpm run format:py:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Python tests
        run: uv run --directory build-tools/tts pytest -q

      - name: Build
        run: pnpm run build

      # Push-to-main only. On a pull request every gate above still runs — that
      # result is what dependabot-auto-merge.yml keys off — but nothing is
      # published, so a PR can never overwrite the live site.
      - name: Deploy
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: dist
          branch: gh-pages
